<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: ノッチ・ホームバーの内側まで画面を広げ、余白は CSS の safe-area で取る -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ごまちゃん家計簿</title>
<meta name="description" content="夫婦2人でつける、ごまちゃんの家計簿">
<meta name="robots" content="noindex, nofollow">

<!-- PWA / iPhone のホーム画面用 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4EFE8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ごま家計簿">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- 文字: Zen Maru Gothic(400 / 500 / 700) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- くり返し使うアイコン(見本 HTML の SVG と同じ形)。<use href="#i-paw"> で呼び出す -->
<svg aria-hidden="true" width="0" height="0" style="position: absolute">
  <symbol id="i-paw" viewBox="0 0 24 24">
    <ellipse cx="12" cy="15.5" rx="5.5" ry="4.5"></ellipse>
    <ellipse cx="5" cy="10" rx="2.2" ry="2.8"></ellipse>
    <ellipse cx="9.3" cy="5.8" rx="2.2" ry="2.9"></ellipse>
    <ellipse cx="14.7" cy="5.8" rx="2.2" ry="2.9"></ellipse>
    <ellipse cx="19" cy="10" rx="2.2" ry="2.8"></ellipse>
  </symbol>
  <symbol id="i-ears" viewBox="0 0 30 9">
    <path d="M1 9 L5 0 L12 9 Z"></path>
    <path d="M29 9 L25 0 L18 9 Z"></path>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 20V10"></path>
    <path d="M12 20V4"></path>
    <path d="M19 20v-7"></path>
  </symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="5" width="16" height="15" rx="3"></rect>
    <path d="M4 10h16"></path>
    <path d="M9 3v4"></path>
    <path d="M15 3v4"></path>
  </symbol>
</svg>

<div class="app">

  <!-- 画面の中身。段階1以降は、タブごとの画面をここに差し込む -->
  <main class="screen" id="screen">

    <!-- 準備中の空画面 -->
    <section class="hero" aria-labelledby="screen-title">
      <h1 class="hero__title" id="screen-title">入力</h1>
      <img class="hero__goma" src="img/goma-round.svg" alt="ごまちゃん" width="168" height="160">
      <p class="bubble">
        <svg class="bubble__paw" aria-hidden="true" width="18" height="18" fill="currentColor"><use href="#i-paw"></use></svg>
        <span id="goma-line">もうすぐ使えるようになるにゃ。</span>
      </p>
      <p class="hero__note">この画面は準備中です</p>
    </section>

    <!-- 保存先(Google スプレッドシート)との接続テスト -->
    <section class="card card--cream connect" id="connect" aria-labelledby="connect-title">
      <h2 class="label" id="connect-title">保存先とのつながり</h2>
      <p class="connect__status" id="connect-status" role="status" aria-live="polite">たしかめています…</p>

      <!-- 合言葉の入力(初回だけ)。保存先が設定済みで、まだ登録していない端末にだけ出す -->
      <form class="login" id="login-form" hidden novalidate>
        <label class="label" for="aikotoba">合言葉</label>
        <input class="input" id="aikotoba" name="aikotoba" type="text"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               enterkeyhint="go" placeholder="じぶんの合言葉" required>
        <button class="btn btn--primary" id="login-button" type="submit">
          <svg class="btn__paw" aria-hidden="true" width="20" height="20" fill="currentColor"><use href="#i-paw"></use></svg>
          <span id="login-button-text">この iPhone を登録する</span>
        </button>
      </form>

      <button class="btn-text" id="forget-button" type="button" hidden>この iPhone の登録をやり直す</button>
    </section>

  </main>

  <!-- 下のタブ(段階0では見た目だけ。押すと選択中の表示だけ変わる) -->
  <nav class="tabs" aria-label="メニュー">
    <button class="tab" type="button" data-tab="input" aria-current="page">
      <svg class="tab__ears" aria-hidden="true" width="30" height="9"><use href="#i-ears"></use></svg>
      <svg class="tab__icon" aria-hidden="true" width="24" height="24" fill="currentColor"><use href="#i-paw"></use></svg>
      入力
    </button>
    <button class="tab" type="button" data-tab="view">
      <svg class="tab__ears" aria-hidden="true" width="30" height="9"><use href="#i-ears"></use></svg>
      <svg class="tab__icon" aria-hidden="true" width="24" height="24"><use href="#i-chart"></use></svg>
      見る
    </button>
    <button class="tab" type="button" data-tab="monthly">
      <svg class="tab__ears" aria-hidden="true" width="30" height="9"><use href="#i-ears"></use></svg>
      <svg class="tab__icon" aria-hidden="true" width="24" height="24"><use href="#i-calendar"></use></svg>
      毎月の設定
    </button>
  </nav>

</div>

<noscript>
  <p style="padding: 20px">このアプリは JavaScript を使います。Safari の設定で JavaScript を有効にしてください。</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
